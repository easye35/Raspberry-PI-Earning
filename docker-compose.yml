services:

  # ---------------------------------------------------------
  # EarnBox Dashboard (Frontend)
  # ---------------------------------------------------------
  earnbox:
    build: ./dashboard
    container_name: earnbox
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - earning_net

  # ---------------------------------------------------------
  # EarnBox Backend (API)
  # ---------------------------------------------------------
  backend:
    user: root
    build: ./backend
    container_name: backend
    ports:
      - "3001:3001"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    networks:
      - earning_net

  # ---------------------------------------------------------
  # Honeygain
  # ---------------------------------------------------------
  honeygain:
    image: honeygain/honeygain:latest
    container_name: honeygain
    restart: unless-stopped
    command: >
      -tou-accept
      -email ${HONEYGAIN_EMAIL}
      -pass ${HONEYGAIN_PASSWORD}
      -device ${HONEYGAIN_DEVICE}
    environment:
      - TZ=${TZ}
    networks:
      - earning_net

  # ---------------------------------------------------------
  # Pawns
  # ---------------------------------------------------------
  pawns:
    image: iproyal/pawns-cli:latest
    container_name: pawns
    restart: unless-stopped
    command: >
      --email=${PAWNS_EMAIL}
      --password=${PAWNS_PASSWORD}
      --device-name=${PAWNS_DEVICE}
      --accept-tos
    environment:
      - TZ=${TZ}
    networks:
      - earning_net

  lotteryminer:
  build: .
  container_name: pi_lottery_miner
  restart: unless-stopped
  env_file:
    - .env
  command: >
    -a sha256d
    -o http://127.0.0.1:8332
    -u ${RPCUSER}
    -p ${RPCPASS}
    --coinbase-addr=${BTCADDR}
    --no-longpoll
    --no-getwork
    --quiet
  
  #--------------------------------------------------------
  # Traffmonetizer
  #--------------------------------------------------------
  traffmonetizer:
    image: traffmonetizer/cli_v2:arm64v8
    container_name: traffmonetizer
    restart: always
    command: start accept --token ${TRAFFMONETIZER_TOKEN}
    networks:
      - earning_net

  # ---------------------------------------------------------
  # Repocket
  # ---------------------------------------------------------
  repocket:
    image: repocket/repocket:latest
    container_name: repocket
    restart: always
    environment:
      - RP_EMAIL=${RP_EMAIL}
      - RP_API_KEY=${RP_API_KEY}
    networks:
      - earning_net

  # ---------------------------------------------------------
  # Netdata (System Stats)
  # ---------------------------------------------------------
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys/class/thermal:/sys/class/thermal:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - earning_net

  # ---------------------------------------------------------
  # Dozzle (Container Logs)
  # ---------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - earning_net

  # ---------------------------------------------------------
  # Earnings Aggregator
  # ---------------------------------------------------------
  earnings:
    build: ./earnings
    container_name: earnings
    restart: unless-stopped
    environment:
      - TZ=America/Edmonton
      - EARNINGS_DB_PATH=/data/earnings.db
      - EARNINGS_JSON_PATH=/data/latest_earnings.json
      - HONEYGAIN_EMAIL=${HONEYGAIN_EMAIL}
      - HONEYGAIN_PASSWORD=${HONEYGAIN_PASSWORD}
      - PAWNS_EMAIL=${PAWNS_EMAIL}
      - PAWNS_PASSWORD=${PAWNS_PASSWORD}
      - EARNAPP_COMMAND=/usr/bin/earnapp
      # Optional SMTP settings for daily notification (set in .env or environment)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_TLS=${SMTP_TLS}
      - NOTIFY_TO=${NOTIFY_TO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - /etc/earnapp:/etc/earnapp:ro
      - /usr/bin/earnapp:/usr/bin/earnapp:ro
      - /usr/local/bin/earnapp:/usr/local/bin/earnapp:ro
    ports:
      - "5000:5000"
    networks:
      - earning_net

  # ---------------------------------------------------------
  # Self-heal service (runs repo-level self-heal script)
  # Installs minimal dependencies at start, runs the script once, then sleeps daily.
  selfheal:
    build:
      context: .
      dockerfile: selfheal/Dockerfile
    container_name: selfheal
    restart: unless-stopped
    volumes:
      - ./:/workdir
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workdir
    command: ["sh","-c","while true; do /workdir/scripts/self_heal.sh || true; sleep 86400; done"]
    networks:
      - earning_net

# ---------------------------------------------------------
# Networks
# ---------------------------------------------------------
networks:
  earning_net:
    driver: bridge
