<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnBox Dashboard</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ---------------------------------------------------------
         MAIN CONTENT
    ---------------------------------------------------------- -->
    <div class="main-content">

        <!-- -----------------------------------------------------
             EARNINGS BANNER
        ------------------------------------------------------ -->
        <div class="earnings-banner">

            <div class="earn-block">
                <h4>Honeygain</h4>
                <p id="honeygain-balance">$0.00</p>
            </div>

            <div class="earn-block">
                <h4>Pawns</h4>
                <p id="pawns-balance">$0.00</p>
            </div>

            <div class="earn-block">
                <h4>Today</h4>
                <p id="today-earnings">$0.00</p>
            </div>

            <div class="earn-block">
                <h4>Projected</h4>
                <p id="projected-earnings">$0.00</p>
            </div>

            <div class="earn-block">
                <h4>Total</h4>
                <p id="total-earnings">$0.00</p>
            </div>

        </div>

        <!-- -----------------------------------------------------
             SYSTEM STATS GRID
        ------------------------------------------------------ -->
        <div class="stats-grid">

            <div class="stat-card">
                <h3>CPU</h3>
                <p id="cpuValue">…</p>
            </div>

            <div class="stat-card">
                <h3>RAM</h3>
                <p id="ramValue">…</p>
            </div>

            <div class="stat-card">
                <h3>Disk</h3>
                <p id="diskValue">…</p>
            </div>

            <div class="stat-card">
                <h3>Network</h3>
                <p id="netValue">RX: …<br>TX: …</p>
            </div>

            <div class="stat-card">
                <h3>Temperature</h3>
                <p id="tempValue">…</p>
            </div>

            <div class="stat-card">
                <h3>Uptime</h3>
                <p id="uptimeBadge">Uptime: …</p>
            </div>

            <div class="stat-card">
                <h3>Reset Service</h3>
                <p id="serviceBadge">Reset Service: …</p>
            </div>

        </div>

        <!-- -----------------------------------------------------
             CONTAINER GRID
        ------------------------------------------------------ -->
        <h2>Containers</h2>
        <div id="containerGrid" class="container-grid">
            <!-- JS will populate cards here -->
        </div>

    </div>

    <!-- ---------------------------------------------------------
         LOGS MODAL
    ---------------------------------------------------------- -->
    <div id="logsModal" class="modal">
        <div class="modal-content">

            <h2>Container Logs</h2>

            <pre id="logsContent"></pre>

            <button id="refreshLogs">Refresh</button>
            <button id="closeLogs">Close</button>

        </div>
    </div>

    <!-- ---------------------------------------------------------
         JAVASCRIPT
    ---------------------------------------------------------- -->
    <script src="js/app.js"></script>

</body>
</html>
